
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Japanvibes Auto – Connected</title>
<style>:root{--bg:#fff;--ink:#161823;--mute:#6b6e78;--line:#e3e3e6}@media (prefers-color-scheme:dark){:root{--bg:#121214;--ink:#f1f1f2;--mute:#9a9ca5;--line:#2c2c33}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:760px;margin:0 auto;padding:32px 16px}
textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);font:13px monospace}
button{background:#fe2c55;color:#fff;border:0;border-radius:8px;padding:10px 18px;font-weight:600;font-size:15px;cursor:pointer}.mute{color:var(--mute)}</style></head>
<body><main>
<h1>Japanvibes Auto</h1>
<div id="ok" hidden>
  <p>✅ Autorisation reçue. Copie l'adresse ci-dessous, puis colle-la dans le champ <b>code</b> du workflow
  <b>🔑 Connexion TikTok</b> sur GitHub (vite : elle expire au bout de quelques minutes).</p>
  <textarea id="url" rows="4" readonly></textarea>
  <p><button id="copier">Copier l'adresse</button> <span id="fait" class="mute"></span></p>
</div>
<p id="erreur" hidden>❌ Autorisation refusée ou annulée : <span id="detail"></span></p>
<p id="vide" class="mute" hidden>This page receives the TikTok login redirect for Japanvibes Auto.</p>
<script>
  var q = new URLSearchParams(location.search);
  if (q.get("code")) {
    document.getElementById("ok").hidden = false;
    document.getElementById("url").value = location.href;
    document.getElementById("copier").onclick = function () {
      var t = document.getElementById("url"); t.select();
      (navigator.clipboard ? navigator.clipboard.writeText(location.href) : Promise.resolve(document.execCommand("copy")))
        .then(function () { document.getElementById("fait").textContent = "Copié ✔"; });
    };
  } else if (q.get("error")) {
    document.getElementById("erreur").hidden = false;
    document.getElementById("detail").textContent = q.get("error_description") || q.get("error");
  } else {
    document.getElementById("vide").hidden = false;
  }
</script>
</main></body></html>
